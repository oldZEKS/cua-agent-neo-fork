[project]
name = "cua-agent"
version = "0.1.0"
description = "Computer Use Agent - Windows GUI automation via UI Automation API"
requires-python = ">=3.11"
dependencies = [
    "uiautomation>=2.0.20",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cua_agent"]
